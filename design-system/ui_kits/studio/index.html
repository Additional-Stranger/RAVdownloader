<!doctype html><html><head><meta charset="utf-8"><title>EditBay Studio</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/keyframes.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>html,body{margin:0;height:100%}#root{height:100vh;position:relative;overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="download-screen.jsx"></script>
<script type="text/babel" src="convert-screen.jsx"></script>
<script type="text/babel" src="social-screen.jsx"></script>
<script type="text/babel" src="merge-screen.jsx"></script>
<script type="text/babel" src="timecode-screen.jsx"></script>
<script type="text/babel" src="misc-screens.jsx"></script>
<script type="text/babel">
const { Toast } = window.EditBayToolsDesignSystem_9ef02b;
function App(){
  const [route,setRoute]=React.useState("download");
  const [toast,setToast]=React.useState(null);
  React.useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),4200); return ()=>clearTimeout(t); },[toast]);
  return (
    <div style={{height:"100%",position:"relative"}}>
      <AppShell route={route} setRoute={setRoute}>
        {route==="download" && <DownloadScreen onToast={setToast}/>}
        {route==="convert" && <ConvertScreen onToast={setToast}/>}
        {route==="social" && <SocialScreen onToast={setToast}/>}
        {route==="merge" && <MergeScreen onToast={setToast}/>}
        {route==="timecode" && <TimecodeScreen/>}
        {route==="attribution" && <AttributionScreen/>}
        {route==="library" && <LibraryScreen/>}
        {route==="premiere" && <PremiereScreen/>}
      </AppShell>
      {toast && <div className="ebt-dark" style={{position:"fixed",right:20,bottom:60,zIndex:80}}>
        <Toast {...toast} onDismiss={()=>setToast(null)}/></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
