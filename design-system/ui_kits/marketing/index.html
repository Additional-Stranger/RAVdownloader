<!-- @dsCard group="editbaytools.com (marketing)" viewport="1280x900" name="Marketing site" subtitle="Product, download, pricing, about, contact — click through" -->
<!doctype html><html><head><meta charset="utf-8"><title>Edit Bay Tools — EditBay Studio</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/keyframes.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--bg-surface)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="home-page.jsx"></script>
<script type="text/babel" src="download-page.jsx"></script>
<script type="text/babel" src="pricing-page.jsx"></script>
<script type="text/babel" src="about-page.jsx"></script>
<script type="text/babel" src="contact-page.jsx"></script>
<script type="text/babel" src="auth-page.jsx"></script>
<script type="text/babel">
function Site(){
  const [route,setRoute]=React.useState("home");
  React.useEffect(()=>{ window.scrollTo(0,0); },[route]);
  return (<div>
    <SiteHeader route={route} setRoute={setRoute}/>
    {route==="home" && <HomePage setRoute={setRoute}/>}
    {route==="download" && <DownloadPage setRoute={setRoute}/>}
    {route==="pricing" && <PricingPage setRoute={setRoute}/>}
    {route==="about" && <AboutPage setRoute={setRoute}/>}
    {route==="contact" && <ContactPage/>}
    {route==="login" && <LoginPage setRoute={setRoute}/>}
    {route==="signup" && <SignupPage setRoute={setRoute}/>}
    {route==="trial" && <TrialPage setRoute={setRoute}/>}
    <SiteFooter setRoute={setRoute}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);
</script></body></html>
