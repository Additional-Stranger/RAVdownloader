<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../guidelines/keyframes.css"><style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)}.g{display:flex;gap:0}.sw{flex:1;height:56px;display:flex;align-items:flex-end;padding:5px 6px;font-family:var(--font-mono);font-size:9px}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:5px}.lbl{font-family:var(--font-display);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--dur-fast</div><div style="width:130px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">120ms</div><div style="font-size:12px;color:var(--text-body)">hover, colour, focus</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--dur-base</div><div style="width:130px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">180ms</div><div style="font-size:12px;color:var(--text-body)">toggles, tabs, toasts</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--dur-slow</div><div style="width:130px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">240ms</div><div style="font-size:12px;color:var(--text-body)">progress, expand</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--dur-panel</div><div style="width:130px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">320ms</div><div style="font-size:12px;color:var(--text-body)">modals, drawers</div></div>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);border-top:1px solid var(--border-subtle);padding-top:9px">--ease-standard cubic-bezier(.2,.6,.2,1) — the default for everything</div>
</div></body></html>
