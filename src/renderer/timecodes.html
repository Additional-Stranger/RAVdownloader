<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Time Codes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #0c0a18;
  --bg2: #14112c;
  --bg3: #1a1738;
  --bg4: #221e4a;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.16);
  --accent: #c30000;
  --accent2: #e63b3b;
  --text: #ffffff;
  --text2: #b8b3d4;
  --text3: #6e6a92;
  --green: #47ffb0;
  --font: 'Syne', sans-serif;
  --mono: 'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font); overflow: hidden;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

#root {
  display: flex; flex-direction: column; height: 100vh;
  background:
    radial-gradient(900px 600px at 50% -10%, rgba(195,0,0,0.10), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(29,20,90,0.6), transparent 60%),
    var(--bg);
}
header {
  padding: 22px 24px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
header h1 {
  font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
}
header h1 span { color: var(--accent2); }
header .sub {
  font-size: 12px; color: var(--text3); margin-top: 4px; font-family: var(--mono);
}
.list {
  flex: 1; overflow-y: auto; padding: 16px 20px 24px;
  display: flex; flex-direction: column; gap: 10px;
}
.row {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  transition: all 0.15s;
}
.row:hover { background: var(--bg4); border-color: var(--border2); }
.row-label {
  flex: 1; min-width: 0;
}
.row-name {
  font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: 0.02em;
}
.row-name em {
  font-style: normal; color: var(--text2); font-weight: 500;
  margin-left: 4px;
}
.row-tc {
  font-family: var(--mono); font-size: 15px; font-weight: 500;
  color: var(--accent2); margin-top: 3px;
}
.copy-btn {
  flex-shrink: 0;
  border: 1px solid var(--border2);
  background: var(--bg4); color: var(--text);
  font-family: var(--font); font-weight: 600; font-size: 11px;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 8px 14px; border-radius: 6px;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.copy-btn:hover { background: var(--accent); border-color: var(--accent); }
.copy-btn.copied { background: var(--green); color: #0a1d12; border-color: var(--green); }
.copy-btn svg { width: 11px; height: 11px; }
footer {
  padding: 12px 24px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text3); font-family: var(--mono);
  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
.copy-all {
  border: 1px solid var(--border2); background: transparent;
  color: var(--text); font-family: var(--font); font-weight: 600;
  font-size: 11px; padding: 7px 12px; border-radius: 6px;
  cursor: pointer; transition: all 0.15s;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.copy-all:hover { background: var(--bg4); border-color: var(--accent); color: var(--accent2); }
.empty {
  text-align: center; padding: 60px 20px; color: var(--text3); font-family: var(--mono);
}
</style>
</head>
<body>
<div id="root">
  <header>
    <h1>Time <span>Codes</span></h1>
    <div class="sub" id="sub">Ad-roll break points between clips</div>
  </header>
  <div class="list" id="list"></div>
  <footer>
    <span id="count">0 breaks</span>
    <button class="copy-all" id="copy-all-btn">Copy All</button>
  </footer>
</div>
<script>
(function () {
  let data = { breaks: [], title: 'Time Codes' };
  try {
    const raw = decodeURIComponent(location.hash.slice(1));
    if (raw) data = JSON.parse(raw);
  } catch (err) {
    console.error('Failed to parse hash data:', err);
  }
  const breaks = Array.isArray(data.breaks) ? data.breaks : [];
  document.title = data.title || 'Time Codes';
  document.getElementById('count').textContent =
    breaks.length + ' break' + (breaks.length === 1 ? '' : 's');

  const list = document.getElementById('list');
  if (!breaks.length) {
    list.innerHTML = '<div class="empty">No breaks &mdash; need at least 2 clips.</div>';
    document.getElementById('copy-all-btn').style.display = 'none';
    return;
  }

  function copyIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  }

  function makeRow(b) {
    const labelText = String(b.label || ('BREAK ' + b.number));
    const m = labelText.match(/^(BREAK \d+)\s*(\(.*\))?$/);
    const head = m ? m[1] : labelText;
    const tail = m && m[2] ? m[2] : '';
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="row-label">' +
        '<div class="row-name">' + head + (tail ? ' <em>' + tail + '</em>' : '') + '</div>' +
        '<div class="row-tc">' + b.timecode + '</div>' +
      '</div>' +
      '<button class="copy-btn">' + copyIcon() + 'Copy</button>';
    const btn = row.querySelector('.copy-btn');
    btn.addEventListener('click', async () => {
      const ok = await writeClip(b.timecode);
      if (ok) {
        btn.classList.add('copied');
        btn.innerHTML = copyIcon() + 'Copied';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = copyIcon() + 'Copy';
        }, 1400);
      }
    });
    return row;
  }

  async function writeClip(text) {
    try {
      if (window.api && window.api.clipboardWrite) {
        const ok = await window.api.clipboardWrite(text);
        if (ok) return true;
      }
    } catch {}
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      return false;
    }
  }

  breaks.forEach(b => list.appendChild(makeRow(b)));

  document.getElementById('copy-all-btn').addEventListener('click', async () => {
    const text = breaks.map(b => (b.label || ('BREAK ' + b.number)) + ' ' + b.timecode).join('\n');
    const btn = document.getElementById('copy-all-btn');
    const ok = await writeClip(text);
    if (ok) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      btn.style.color = '#47ffb0';
      btn.style.borderColor = '#47ffb0';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 1400);
    }
  });
})();
</script>
</body>
</html>
